<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Vista de diseño · Pantalla de carga</title>
    <link
      rel="preload"
      href="/fonts/press-start-2p-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/src/theme.css" />
  </head>
  <body>
    <!-- Vista estática del HTML inicial; el juego real conecta el progreso en src/loading-screen.ts. -->
    <section
      id="loading-screen"
      class="loading-screen"
      aria-label="Cargando Guerra Saltana"
    >
      <div class="loading-panel">
        <div class="loading-unit">
          <img
            src="/assets/saltouruguayserver-pixel.png"
            width="48"
            height="64"
            alt="SaltoUruguayServer"
          /><span
            >SALTOURUGUAYSERVER<br /><small>BRIGADA DEL LITORAL</small></span
          >
        </div>
        <div class="loading-insignia" aria-hidden="true">
          <span>★</span><i></i><i></i><i></i>
        </div>
        <h1>GUERRA<br />SALTANA</h1>
        <p class="loading-subtitle">Preparando el despliegue</p>
        <div class="loading-meter-heading">
          <span id="loading-stage" role="status" aria-live="polite"
            >Iniciando comunicaciones…</span
          ><output id="loading-percent">0%</output>
        </div>
        <div
          id="loading-progress"
          class="loading-progress"
          role="progressbar"
          aria-label="Carga de recursos"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
        >
          <span id="loading-fill"></span>
        </div>
        <div class="loading-checks" aria-hidden="true">
          <span id="loading-font-check">□ FUENTE</span
          ><span id="loading-assets-check">□ ARSENAL</span
          ><span id="loading-scene-check">□ TERRENO</span>
        </div>
        <p class="loading-tip">
          Q / E regulan la potencia.<br />El viento también juega.
        </p>
        <button id="loading-retry" hidden>REINTENTAR CARGA</button>
      </div>
      <span class="loading-footer">COSTANERA DE SALTO / OPERACIÓN NARANJA</span>
      <noscript>Activá JavaScript para cargar Guerra Saltana.</noscript>
    </section>
  </body>
</html>
